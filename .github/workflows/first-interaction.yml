name: First interaction
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
permissions:
  issues: write
  pull-requests: write
jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening an issue.
            Factory pages must follow docs/PROMPT_TEMPLATE.md and pass the four gates in eval/rubric.md.
          pr-message: |
            Thanks for the PR.
            Please check docs/PROMPT_TEMPLATE.md and keep Inbox / incomplete prompts out of main.
